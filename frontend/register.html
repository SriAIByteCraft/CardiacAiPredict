<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | CardioPredict</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="navbar-brand">
        <span class="heart-icon">❤️</span>
        <span>Cardio<span class="highlight">Predict</span></span>
      </a>
      <div class="nav-auth-actions" id="nav-auth-container">
        <a href="login.html" class="btn btn-outline btn-sm">Sign In</a>
      </div>
    </div>
  </nav>

  <main class="main-content auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-icon-circle">📝</div>
        <h1>Create Account</h1>
        <p>Register to manage predictions and track patient cardiovascular assessments.</p>
      </div>

      <div class="auth-body">
        <form id="register-form">
          <div class="form-group">
            <label class="form-label" for="reg-name">Full Name</label>
            <input type="text" id="reg-name" name="name" class="form-control" placeholder="e.g. Dr. Jane Doe" required minlength="2">
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-email">Email Address</label>
            <input type="email" id="reg-email" name="email" class="form-control" placeholder="doctor@hospital.org" required>
            <small class="form-helper">Normalized and uniquely indexed in MongoDB.</small>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-password">Password</label>
            <input type="password" id="reg-password" name="password" class="form-control" placeholder="••••••••" required minlength="8">
            <small class="form-helper">Must be at least 8 characters with at least one letter and one number.</small>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-confirm-password">Confirm Password</label>
            <input type="password" id="reg-confirm-password" name="confirm_password" class="form-control" placeholder="••••••••" required>
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
            Register & Continue
          </button>
        </form>

        <div class="auth-footer-links">
          Already have an account? <a href="login.html"><strong>Sign in here</strong></a>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    import { initRegisterForm, redirectIfAuthenticated } from './js/auth.js';
    redirectIfAuthenticated();
    initRegisterForm('register-form');
  </script>
</body>
</html>
