[project]
name = "cardiac-ai-predict"
version = "1.0.0"
description = "Heart Disease Prediction System using Stacking Ensemble Machine Learning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask==3.0.3",
    "flask-cors==4.0.1",
    "python-dotenv==1.0.1",
    "pymongo==4.7.2",
    "dnspython==2.6.1",
    "werkzeug==3.0.3",
    "scikit-learn==1.4.2",
    "imbalanced-learn==0.12.3",
    "pandas==2.2.2",
    "numpy==1.26.4",
    "joblib==1.4.2",
    "matplotlib==3.8.4",
    "seaborn==0.13.2",
    "mongomock==4.1.2",
]

[tool.vercel]
entrypoint = "backend.app:app"
